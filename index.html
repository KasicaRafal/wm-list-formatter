<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warmachine List Formatter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>Warmachine List Formatter</h1>

    <p class="subtitle">
        Paste your list, format it and copy the result.
    </p>

    <div class="card">

        <label for="input">Input</label>

        <textarea
                id="input"
                placeholder="Paste your Warmachine list here..."></textarea>

        <div class="buttons">

            <button id="formatBtn" class="primary">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                Format
            </button>

        </div>

        <div class="outputs">

            <div class="output-section">

                <div class="output-header">
                    <label for="output">Output</label>
                </div>

                <textarea
                        id="output"
                        readonly></textarea>

                <button id="copyBtn">
                    <i class="fa-regular fa-copy"></i>
                    Copy Result
                </button>

            </div>

            <div class="output-section">

                <div class="output-header tooltip-container">
                    <label for="outputWT">Output for WT</label>

                    <span class="tooltip">
                        For Krystian, because copying without apostrophes is hard, apparently
                    </span>
                </div>

                <textarea
                        id="outputWT"
                        readonly></textarea>

                <button id="copyWTBtn">
                    <i class="fa-regular fa-copy"></i>
                    Copy result for WT
                </button>

            </div>

        </div>

    </div>

</div>

<div id="toast" class="toast">
    Copied to clipboard
</div>

<script src="script.js"></script>

</body>
</html>
